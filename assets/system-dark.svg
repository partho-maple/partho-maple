<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="System map: iOS, Android and React Native apps talk to a GraphQL BFF and AWS services at 99.99% uptime; CI/CD pipeline from commit to monitor"><title>System map: iOS, Android and React Native apps talk to a GraphQL BFF and AWS services at 99.99% uptime; CI/CD pipeline from commit to monitor</title><style>
