<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Impact: 14+ years, 20M+ daily users, 80M users, 99.99% availability, 70% faster builds"><title>Impact: 14+ years, 20M+ daily users, 80M users, 99.99% availability, 70% faster builds</title><style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .card{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:fill 1.4s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fill{to{transform:scaleX(1)}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-300px)}35%,100%{transform:translateX(1300px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.in,.card,.node,.role0{opacity:1!important}.track{stroke-dashoffset:0!important}.bar{transform:none!important}}</style>
    <defs><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="c"><rect x="0.0" width="188.8" height="150" rx="12"/><rect x="202.8" width="188.8" height="150" rx="12"/><rect x="405.6" width="188.8" height="150" rx="12"/><rect x="608.4" width="188.8" height="150" rx="12"/><rect x="811.2" width="188.8" height="150" rx="12"/></clipPath></defs>
    
        <g class="card" style="animation-delay:0.0s"><g transform="translate(0.0 0)">
          <rect x=".5" y=".5" width="187.8" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
          <text class="sans" x="20" y="62" font-size="40" font-weight="800" fill="#1f2328" letter-spacing="-1">14+</text>
          <text class="sans" x="20" y="88" font-size="14" font-weight="600" fill="#e0442b">years</text>
          <text class="sans" x="20" y="110" font-size="13" fill="#59636e">building software</text>
          <rect class="bar" style="animation-delay:0.3s" x="20" y="128" width="148.8" height="3" rx="1.5" fill="#d4760a"/>
        </g></g>
        <g class="card" style="animation-delay:0.12s"><g transform="translate(202.8 0)">
          <rect x=".5" y=".5" width="187.8" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
          <text class="sans" x="20" y="62" font-size="40" font-weight="800" fill="#1f2328" letter-spacing="-1">20M+</text>
          <text class="sans" x="20" y="88" font-size="14" font-weight="600" fill="#e0442b">daily users</text>
          <text class="sans" x="20" y="110" font-size="13" fill="#59636e">Amazon Fire TV app</text>
          <rect class="bar" style="animation-delay:0.42s" x="20" y="128" width="148.8" height="3" rx="1.5" fill="#d4760a"/>
        </g></g>
        <g class="card" style="animation-delay:0.24s"><g transform="translate(405.6 0)">
          <rect x=".5" y=".5" width="187.8" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
          <text class="sans" x="20" y="62" font-size="40" font-weight="800" fill="#1f2328" letter-spacing="-1">80M</text>
          <text class="sans" x="20" y="88" font-size="14" font-weight="600" fill="#e0442b">users</text>
          <text class="sans" x="20" y="110" font-size="13" fill="#59636e">on Zalando sign-in I built</text>
          <rect class="bar" style="animation-delay:0.54s" x="20" y="128" width="148.8" height="3" rx="1.5" fill="#d4760a"/>
        </g></g>
        <g class="card" style="animation-delay:0.36s"><g transform="translate(608.4 0)">
          <rect x=".5" y=".5" width="187.8" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
          <text class="sans" x="20" y="62" font-size="40" font-weight="800" fill="#1f2328" letter-spacing="-1">99.99%</text>
          <text class="sans" x="20" y="88" font-size="14" font-weight="600" fill="#e0442b">availability</text>
          <text class="sans" x="20" y="110" font-size="13" fill="#59636e">AWS services I run</text>
          <rect class="bar" style="animation-delay:0.6599999999999999s" x="20" y="128" width="148.8" height="3" rx="1.5" fill="#d4760a"/>
        </g></g>
        <g class="card" style="animation-delay:0.48s"><g transform="translate(811.2 0)">
          <rect x=".5" y=".5" width="187.8" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
          <text class="sans" x="20" y="62" font-size="40" font-weight="800" fill="#1f2328" letter-spacing="-1">-70%</text>
          <text class="sans" x="20" y="88" font-size="14" font-weight="600" fill="#e0442b">build time</text>
          <text class="sans" x="20" y="110" font-size="13" fill="#59636e">after modularising</text>
          <rect class="bar" style="animation-delay:0.78s" x="20" y="128" width="148.8" height="3" rx="1.5" fill="#d4760a"/>
        </g></g>
    <g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="220" height="150" fill="url(#s)" transform="skewX(-20)"/></g>
    </svg>
